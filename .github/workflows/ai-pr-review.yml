name: AI PR Review (Copilot Style)

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize]

jobs:
  review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch PR diff
        id: diff
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl -s \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github.v3.diff" \
            "${{ github.event.pull_request.url }}" > pr.diff
          {
            echo 'content<<EOF'
            cat pr.diff
            echo EOF
          } >> "$GITHUB_OUTPUT"

      - name: Claude Code Action Official
        uses: anthropics/claude-code-action@v1
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_BASE_URL: https://open.bigmodel.cn/api/anthropic
          ANTHROPIC_DEFAULT_MODEL: glm-4.7
        with:
          prompt: |
            You are an AI code reviewer like GitHub Copilot Review.

            Review the following PR diff and provide feedback with these sections:
            - **Summary**: Brief overview of changes
            - **Potential Issues**: Any bugs, security issues, or concerns
            - **Suggestions**: Improvements or best practices
            - **LGTM**: Overall assessment (LGTM / Needs Changes)

            PR diff:
            ${{ steps.diff.outputs.content }}
          output: review.md

      - name: Create or update bot comment
        uses: actions/github-script@v8
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('review.md', 'utf8');
            const commentBody = '### 🤖 AI PR Review (GLM)\n\n' + body;

            const comments = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const botComment = comments.data.find(c =>
              c.user.login === 'github-actions[bot]' &&
              c.body.startsWith('### 🤖 AI PR Review')
            );

            if (botComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body: commentBody
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: commentBody
              });
            }
